[package]
name = "nostos-api"
version = "0.1.0"
description = "Nostos HTTP API: trips, photo uploads, metadata ingestion and stop detection on PostGIS."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nostos-api"
path = "src/main.rs"

[dependencies]
nostos-exif = { path = "../nostos-exif", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
object_store = { version = "0.12", features = ["aws"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
thumbhash = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
bytes = "1"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
