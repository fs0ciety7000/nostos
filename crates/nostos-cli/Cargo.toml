[package]
name = "nostos-cli"
version = "0.2.0"
description = "nostos command line: scan a folder of Fujifilm photos to GeoJSON, or import it into a Nostos instance."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nostos"
path = "src/main.rs"

[dependencies]
nostos-exif = { path = "../nostos-exif", features = ["serde"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "proxy-from-env"] }

[lints]
workspace = true
