[package]
name = "nostos-cli"
version = "0.1.0"
description = "Scans a folder of Fujifilm photos and writes their positions and recipes as GeoJSON."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nostos-scan"
path = "src/main.rs"

[dependencies]
nostos-exif = { path = "../nostos-exif", features = ["serde"] }
serde_json = "1"

[lints]
workspace = true
